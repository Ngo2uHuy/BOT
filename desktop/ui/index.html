<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Affiliate Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">AD</span>
        <span class="brand-text">Affiliate Desk<small>Bảng điều khiển</small></span>
      </div>
      <nav id="nav" class="nav" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-foot">Dữ liệu lưu trên máy này</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <h1 id="page-title" class="topbar-title">Tổng quan</h1>
        <div class="topbar-actions">
          <label class="account-select">
            <span>Tài khoản</span>
            <select id="owner-select" data-change="owner" aria-label="Tài khoản đang quản lý"></select>
          </label>
          <span id="runtime-pill" class="pill pill-stopped">Đã dừng</span>
          <button class="btn btn-icon" data-action="refresh" title="Làm mới dữ liệu" aria-label="Làm mới dữ liệu" id="refresh-button"></button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1">
        <div class="loading"><div class="spinner"></div><p>Đang mở không gian làm việc…</p></div>
      </main>
      <footer class="statusbar">
        <span id="status-runtime">Đang kiểm tra kết nối…</span>
        <span id="status-refresh"></span>
      </footer>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
