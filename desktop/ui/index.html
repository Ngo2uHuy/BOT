<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Affiliate Desk — Không gian vận hành</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Affiliate Desk, tổng quan"><span class="brand-mark">a<span></span></span><span>Affiliate Desk<span class="brand-caption">DESKTOP WORKSPACE</span></span></a>
      <div class="workspace-label"><span class="workspace-avatar">A</span><span>Không gian của bạn<small>Facebook & Affiliate</small></span><span class="local-dot" title="Dữ liệu trên máy"></span></div>
      <div class="nav-label">KHÔNG GIAN LÀM VIỆC</div>
      <nav id="navigation" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-bottom">
        <div class="local-card"><span class="local-icon" id="local-icon"></span><div>Thiết bị của bạn<small>Dữ liệu được lưu cục bộ</small></div></div>
        <button class="sidebar-help" data-action="navigate" data-page="console"><span id="console-icon"></span><span>Bảng lệnh nâng cao</span><kbd>/</kbd></button>
        <div class="sidebar-version">AFFILIATE DESK <span>v0.1</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>Không gian làm việc</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Tổng quan</strong></div>
        <div class="topbar-actions"><label class="owner-select"><span id="owner-icon"></span><select id="owner-select" aria-label="Tài khoản đang quản lý"><option value="">Chưa có tài khoản</option></select></label><span class="topbar-divider"></span><button class="icon-button" data-action="refresh" title="Làm mới dữ liệu" aria-label="Làm mới dữ liệu" id="refresh-button"></button></div>
      </header>
      <main id="main" tabindex="-1"><div class="loading-page"><div class="spinner"></div><p>Đang mở không gian làm việc…</p></div></main>
      <footer class="statusbar"><span id="runtime-status"><span class="status-dot"></span> Đang kiểm tra kết nối</span><span id="last-refresh">Dữ liệu trên thiết bị này</span></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
